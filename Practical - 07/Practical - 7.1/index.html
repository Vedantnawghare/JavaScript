<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taskly — Clipboard To-Do</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

:root{
    --ink:#242017;
    --ink-soft:#4a4436;

    --wood:#d9a15c;
    --wood-dark:#b97f3e;
    --wood-light:#f0c088;

    --paper:#fffdf6;
    --paper-2:#fbf6e9;
    --desk:#efe3c8;

    --green:#4f9a52;
    --green-dark:#3c7a3f;
    --green-light:#e2f1df;

    --yellow:#e8a93a;
    --yellow-light:#fdf0d5;

    --red:#dd6a52;
    --red-light:#fbe6e0;

    --blue:#4c85ad;
    --blue-light:#e4eef5;
}

body{
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    color:var(--ink);
    background:
        radial-gradient(circle at 12% 8%, #f8e9c8 0, transparent 32%),
        radial-gradient(circle at 88% 92%, #e6ecd8 0, transparent 32%),
        var(--desk);
    padding:36px 20px;
}

/* subtle desk texture using repeating lines */
body::before{
    content:"";
    position:fixed; inset:0;
    background-image: repeating-linear-gradient(135deg, rgba(0,0,0,0.015) 0 2px, transparent 2px 14px);
    pointer-events:none;
}

/* =========================================================
   BOARD (the whole app)
========================================================= */
.board{
    max-width:1080px;
    margin:0 auto;
    position:relative;
}

/* wooden clip at the top, like the clipboard photo */
.clip{
    width:150px;
    height:56px;
    margin:0 auto -30px;
    position:relative;
    z-index:3;
    background:linear-gradient(180deg,var(--wood-light),var(--wood) 55%, var(--wood-dark));
    border:3px solid var(--ink);
    border-radius:14px;
    box-shadow:0 6px 0 rgba(0,0,0,0.08);
}
.clip::after{
    content:"";
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:64px; height:16px;
    background:var(--desk);
    border:3px solid var(--ink);
    border-radius:8px;
}

/* the clipboard board underneath the paper */
.backboard{
    background:linear-gradient(180deg,var(--wood-light),var(--wood) 45%, var(--wood-dark));
    border:3px solid var(--ink);
    border-radius:30px;
    padding:34px 18px 22px;
    box-shadow:0 24px 46px rgba(60,42,15,0.22);
}

/* the paper sheet, where everything lives */
.paper{
    background:var(--paper);
    border:3px solid var(--ink);
    border-radius:22px;
    padding:30px 30px 20px;
    display:grid;
    grid-template-columns:220px 1fr;
    gap:26px;
}

/* =========================================================
   SIDEBAR (filters, drawn like a margin note column)
========================================================= */
.sidebar{
    border-right:3px dashed #d8cfb6;
    padding-right:22px;
    display:flex;
    flex-direction:column;
    gap:22px;
}

.brand{
    display:flex; align-items:center; gap:10px;
}
.brand-mark{
    width:42px; height:42px;
    border:3px solid var(--ink);
    border-radius:11px;
    background:var(--green);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:800;
    box-shadow:0 3px 0 var(--green-dark);
}
.brand h1{
    font-family:'Baloo 2',sans-serif;
    font-size:20px;
    letter-spacing:-0.3px;
}
.brand span{
    display:block;
    font-size:10.5px;
    color:var(--ink-soft);
    font-weight:700;
}

.nav-label{
    font-family:'Baloo 2',sans-serif;
    font-size:11px;
    color:#a4977a;
    font-weight:700;
    letter-spacing:0.4px;
}

.filters{ display:flex; flex-direction:column; gap:8px; }

.filter-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px;
    border:2.5px solid var(--ink);
    border-radius:12px;
    background:var(--paper);
    cursor:pointer;
    font-weight:700;
    font-size:12.5px;
    box-shadow:0 3px 0 var(--ink);
    transition:.12s;
}
.filter-item .fl{ display:flex; align-items:center; gap:8px; }
.filter-item .fi{ width:18px; text-align:center; }
.filter-item:hover{ transform:translateY(-1px); }
.filter-item:active{ transform:translateY(1px); box-shadow:0 1px 0 var(--ink); }
.filter-item.active{ background:var(--green); color:#fff; }
.filter-item.active .badge{ background:rgba(255,255,255,0.25); color:#fff; }

.badge{
    font-size:10.5px;
    font-weight:800;
    background:var(--paper-2);
    border:2px solid var(--ink);
    padding:1px 7px;
    border-radius:8px;
}

.progress-card{
    margin-top:auto;
    border:2.5px solid var(--ink);
    border-radius:14px;
    padding:14px;
    background:var(--yellow-light);
    box-shadow:0 3px 0 var(--ink);
}
.progress-top{
    display:flex; justify-content:space-between; align-items:center;
    font-size:11px; font-weight:800; margin-bottom:8px;
}
.progress-top span:last-child{ color:var(--green-dark); font-size:14px; }
.progress-track{
    height:12px;
    background:#fff;
    border:2px solid var(--ink);
    border-radius:20px;
    overflow:hidden;
}
.progress-fill{
    height:100%; width:0%;
    background:repeating-linear-gradient(45deg,var(--green),var(--green) 8px, var(--green-dark) 8px, var(--green-dark) 16px);
    border-radius:20px;
    transition:width .35s ease;
}

/* =========================================================
   MAIN
========================================================= */
.main{ min-width:0; }

.title-row{
    text-align:center;
    margin-bottom:20px;
    padding-bottom:16px;
    border-bottom:3px solid var(--ink);
}
.title-row h2{
    font-family:'Baloo 2',sans-serif;
    font-size:34px;
    letter-spacing:0.5px;
    text-transform:uppercase;
}
.title-row p{
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:600;
    margin-top:4px;
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:18px;
}
.stat{
    border:2.5px solid var(--ink);
    border-radius:13px;
    padding:10px 12px;
    background:var(--paper-2);
    box-shadow:0 3px 0 var(--ink);
    text-align:center;
}
.stat-label{ font-size:9.5px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.3px;}
.stat-value{ font-family:'Baloo 2',sans-serif; font-size:22px; }
.stat.green .stat-value{ color:var(--green-dark); }
.stat.yellow .stat-value{ color:#a97417; }
.stat.red .stat-value{ color:var(--red); }

/* ADD TASK */
.add-task{
    display:grid;
    grid-template-columns:1fr auto auto auto;
    gap:8px;
    padding:10px;
    background:var(--green-light);
    border:2.5px solid var(--ink);
    border-radius:16px;
    margin-bottom:14px;
}
.add-task input[type="text"]{
    border:2px solid var(--ink);
    border-radius:11px;
    padding:10px 12px;
    font-size:13px;
    font-family:'Nunito',sans-serif;
    font-weight:700;
    outline:none;
    background:#fff;
}
.add-task input[type="text"]::placeholder{ color:#a29c8c; font-weight:600; }
.priority-select, .date-input{
    border:2px solid var(--ink);
    border-radius:11px;
    padding:0 10px;
    font-size:11.5px;
    font-weight:700;
    background:#fff;
    color:var(--ink);
    cursor:pointer;
}
.add-task button{
    border:2px solid var(--ink);
    background:var(--green);
    color:#fff;
    padding:0 16px;
    border-radius:11px;
    font-size:12.5px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 3px 0 var(--green-dark);
    transition:.12s;
}
.add-task button:hover{ transform:translateY(-1px); }
.add-task button:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--green-dark); }

/* TOOLBAR */
.toolbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:14px; gap:10px;
}
.search{
    display:flex; align-items:center; gap:8px;
    border:2.5px solid var(--ink);
    background:#fff;
    padding:8px 12px;
    border-radius:11px;
    width:220px;
}
.search input{ border:none; outline:none; width:100%; font-size:11.5px; font-weight:700; background:transparent;}
.clear-btn{
    border:2px solid var(--ink);
    background:var(--red-light);
    color:var(--red);
    font-size:11px;
    font-weight:800;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
}
.clear-btn:hover{ background:var(--red); color:#fff; }

.task-heading{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:8px;
}
.task-heading h3{ font-family:'Baloo 2',sans-serif; font-size:16px; }
.task-count{ font-size:11px; font-weight:700; color:var(--ink-soft); }

/* TASK LIST */
.task-list{ list-style:none; max-height:400px; overflow-y:auto; padding-right:4px; }
.task-list::-webkit-scrollbar{ width:6px; }
.task-list::-webkit-scrollbar-thumb{ background:var(--wood); border-radius:10px; }

.task-card{
    display:flex; align-items:flex-start; gap:12px;
    background:var(--paper);
    border:2.5px solid var(--ink);
    padding:12px 13px;
    margin:9px 0;
    border-radius:14px;
    box-shadow:0 3px 0 rgba(36,32,23,0.3);
    animation:appear .2s ease;
}
@keyframes appear{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

/* chunky checkbox like the reference image */
.check{
    width:30px; height:30px;
    border:2.5px solid var(--ink);
    background:#fff;
    border-radius:9px;
    flex-shrink:0;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    font-size:17px;
    font-weight:900;
    margin-top:2px;
}
.task-card.completed .check{ background:var(--green); }
.task-card.completed .check::after{ content:"✓"; }
.task-card.completed .task-text{ text-decoration:line-through; color:#b6ae9d; }

.task-content{ flex:1; min-width:0; }
.task-text{
    display:block;
    font-size:13.5px;
    font-weight:700;
    line-height:1.35;
    word-break:break-word;
    padding-bottom:6px;
    margin-bottom:6px;
    border-bottom:2px solid #e6ddc9; /* ruled-line motif from the reference */
}
.task-meta{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.priority{ font-size:9.5px; padding:3px 8px; border-radius:7px; font-weight:800; border:1.5px solid var(--ink); }
.priority.normal{ background:#f0eee5; color:var(--ink-soft); }
.priority.important{ background:var(--yellow-light); color:#a1721a; }
.priority.urgent{ background:var(--red-light); color:#b2503b; }
.due-date{ font-size:9.5px; font-weight:700; color:#8f8873; }
.overdue{ color:var(--red); }

.actions{ display:flex; gap:6px; margin-top:2px; }
.actions button{
    width:28px; height:28px;
    border:2px solid var(--ink);
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
    font-weight:800;
}
.edit-btn{ background:var(--blue-light); color:var(--blue); }
.delete-btn{ background:var(--red-light); color:var(--red); }
.actions button:hover{ transform:scale(1.06); }

/* EMPTY */
.empty{
    text-align:center;
    padding:46px 20px;
    border:3px dashed #d8cfb6;
    border-radius:16px;
    background:var(--paper-2);
}
.empty-icon{
    width:56px; height:56px;
    border-radius:16px;
    background:var(--yellow-light);
    border:2.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 10px;
    font-size:24px;
}
.empty h4{ font-family:'Baloo 2',sans-serif; font-size:15px; margin-bottom:4px; }
.empty p{ font-size:11px; color:var(--ink-soft); font-weight:600; }

.footer{
    text-align:center; margin-top:16px;
    font-size:10.5px; font-weight:700; color:var(--ink-soft);
}

/* RESPONSIVE */
@media(max-width:820px){
    .paper{ grid-template-columns:1fr; }
    .sidebar{ border-right:none; border-bottom:3px dashed #d8cfb6; padding-right:0; padding-bottom:18px; flex-direction:row; flex-wrap:wrap; align-items:center; }
    .brand{ width:100%; }
    .progress-card{ margin-top:0; flex:1 1 100%; }
    .filters{ flex-direction:row; flex-wrap:wrap; flex:1; }
    .filter-item{ flex:1 1 auto; }
}
@media(max-width:600px){
    body{ padding:20px 10px; }
    .backboard{ padding:26px 8px 14px; border-radius:22px; }
    .paper{ padding:20px 16px 14px; border-radius:16px; }
    .title-row h2{ font-size:26px; }
    .add-task{ grid-template-columns:1fr 1fr; }
    .add-task input[type="text"]{ grid-column:1/-1; }
    .toolbar{ flex-direction:column; align-items:stretch; }
    .search{ width:100%; }
}
</style>
</head>
<body>

<div class="board">
    <div class="clip"></div>
    <div class="backboard">
        <div class="paper">

            <!-- SIDEBAR -->
            <aside class="sidebar">
                <div class="brand">
                    <div class="brand-mark">✓</div>
                    <div>
                        <h1>Taskly</h1>
                        <span>My little clipboard</span>
                    </div>
                </div>

                <div>
                    <div class="nav-label" style="margin-bottom:8px;">WORKSPACE</div>
                    <nav class="filters">
                        <div class="filter-item active" data-filter="all">
                            <span class="fl"><span class="fi">☰</span><span>All tasks</span></span>
                            <span class="badge" id="allCount">0</span>
                        </div>
                        <div class="filter-item" data-filter="important">
                            <span class="fl"><span class="fi">⭐</span><span>Important</span></span>
                            <span class="badge" id="importantCount">0</span>
                        </div>
                        <div class="filter-item" data-filter="urgent">
                            <span class="fl"><span class="fi">⚡</span><span>Urgent</span></span>
                            <span class="badge" id="urgentCount">0</span>
                        </div>
                        <div class="filter-item" data-filter="completed">
                            <span class="fl"><span class="fi">✓</span><span>Completed</span></span>
                            <span class="badge" id="completedCount">0</span>
                        </div>
                    </nav>
                </div>

                <div class="progress-card">
                    <div class="progress-top">
                        <span>Today's progress</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                </div>
            </aside>

            <!-- MAIN -->
            <main class="main">

                <div class="title-row">
                    <h2>To Do List</h2>
                    <p>Small steps every day make big things happen.</p>
                </div>

                <section class="stats">
                    <div class="stat"><div class="stat-label">Total</div><div class="stat-value" id="totalStat">0</div></div>
                    <div class="stat green"><div class="stat-label">Completed</div><div class="stat-value" id="doneStat">0</div></div>
                    <div class="stat yellow"><div class="stat-label">Remaining</div><div class="stat-value" id="remainingStat">0</div></div>
                </section>

                <div class="add-task">
                    <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
                    <select id="prioritySelect" class="priority-select">
                        <option value="normal">Normal</option>
                        <option value="important">⭐ Important</option>
                        <option value="urgent">⚡ Urgent</option>
                    </select>
                    <input type="date" id="dueDate" class="date-input">
                    <button id="addBtn">+ Add</button>
                </div>

                <div class="toolbar">
                    <div class="search">
                        <span>🔎</span>
                        <input type="text" id="searchInput" placeholder="Search tasks...">
                    </div>
                    <button class="clear-btn" id="clearCompleted">Clear completed</button>
                </div>

                <div class="task-heading">
                    <h3 id="listHeading">Your checklist</h3>
                    <span class="task-count" id="taskCount">0 tasks</span>
                </div>

                <ul class="task-list" id="taskList"></ul>

            </main>
        </div>
    </div>
    <div class="footer">✦ Stay organized • Stay productive ✦</div>
</div>

<script>
/* =========================================================
   ELEMENTS
========================================================= */
const taskInput = document.getElementById("taskInput");
const prioritySelect = document.getElementById("prioritySelect");
const dueDate = document.getElementById("dueDate");
const addBtn = document.getElementById("addBtn");
const taskList = document.getElementById("taskList");
const searchInput = document.getElementById("searchInput");
const clearCompleted = document.getElementById("clearCompleted");

const taskCount = document.getElementById("taskCount");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");

const totalStat = document.getElementById("totalStat");
const doneStat = document.getElementById("doneStat");
const remainingStat = document.getElementById("remainingStat");

const allCount = document.getElementById("allCount");
const importantCount = document.getElementById("importantCount");
const urgentCount = document.getElementById("urgentCount");
const completedCount = document.getElementById("completedCount");

const pageTitle = document.getElementById("listHeading");

/* =========================================================
   STATE (kept in memory for this session)
========================================================= */
let tasks = [
    { id:1, text:"Sketch the weekly layout", priority:"important", dueDate:"", completed:true },
    { id:2, text:"Water the office plants", priority:"normal", dueDate:"", completed:true },
    { id:3, text:"Reply to client emails", priority:"urgent", dueDate:"", completed:true }
];
let currentFilter = "all";
let searchTerm = "";

/* =========================================================
   ADD TASK
========================================================= */
function addTask(){
    const text = taskInput.value.trim();
    const priority = prioritySelect.value;
    const date = dueDate.value;

    if(!text){ alert("Please enter a task."); taskInput.focus(); return; }

    tasks.push({ id: Date.now(), text, priority, dueDate: date, completed: false });

    taskInput.value = "";
    dueDate.value = "";
    prioritySelect.value = "normal";
    taskInput.focus();
    renderTasks();
}

function deleteTask(id){
    tasks = tasks.filter(t => t.id !== id);
    renderTasks();
}

function toggleTask(id){
    tasks = tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t);
    renderTasks();
}

function editTask(id){
    const task = tasks.find(t => t.id === id);
    if(!task) return;

    const newText = prompt("Edit task:", task.text);
    if(newText === null || !newText.trim()) return;
    task.text = newText.trim();

    const newPriority = prompt("Priority:\n\nnormal\nimportant\nurgent", task.priority);
    if(["normal","important","urgent"].includes(newPriority)) task.priority = newPriority;

    renderTasks();
}

clearCompleted.addEventListener("click", () => {
    tasks = tasks.filter(t => !t.completed);
    renderTasks();
});

/* =========================================================
   HELPERS
========================================================= */
function formatDate(dateString){
    if(!dateString) return "";
    const date = new Date(dateString + "T00:00:00");
    return date.toLocaleDateString("en-US", { month:"short", day:"numeric" });
}

function isOverdue(task){
    if(!task.dueDate || task.completed) return false;
    const todayString = new Date().toISOString().split("T")[0];
    return task.dueDate < todayString;
}

function getFilteredTasks(){
    return tasks.filter(task => {
        let matchesFilter = true;
        if(currentFilter === "important") matchesFilter = task.priority === "important";
        else if(currentFilter === "urgent") matchesFilter = task.priority === "urgent";
        else if(currentFilter === "completed") matchesFilter = task.completed;

        let matchesSearch = true;
        if(searchTerm) matchesSearch = task.text.toLowerCase().includes(searchTerm);

        return matchesFilter && matchesSearch;
    });
}

/* =========================================================
   CREATE TASK CARD
========================================================= */
function createTaskCard(task){
    const li = document.createElement("li");
    li.className = "task-card" + (task.completed ? " completed" : "");

    const check = document.createElement("button");
    check.className = "check";
    check.setAttribute("aria-label","Complete task");
    check.onclick = () => toggleTask(task.id);

    const content = document.createElement("div");
    content.className = "task-content";

    const text = document.createElement("span");
    text.className = "task-text";
    text.textContent = task.text;

    const meta = document.createElement("div");
    meta.className = "task-meta";

    const badge = document.createElement("span");
    badge.className = "priority " + task.priority;
    badge.textContent = task.priority === "important" ? "⭐ Important"
                        : task.priority === "urgent" ? "⚡ Urgent" : "Normal";
    meta.appendChild(badge);

    if(task.dueDate){
        const date = document.createElement("span");
        date.className = "due-date" + (isOverdue(task) ? " overdue" : "");
        date.textContent = (isOverdue(task) ? "⚠ Overdue • " : "📅 ") + formatDate(task.dueDate);
        meta.appendChild(date);
    }

    content.appendChild(text);
    content.appendChild(meta);

    const actions = document.createElement("div");
    actions.className = "actions";

    const edit = document.createElement("button");
    edit.className = "edit-btn";
    edit.textContent = "✎";
    edit.title = "Edit task";
    edit.onclick = () => editTask(task.id);

    const remove = document.createElement("button");
    remove.className = "delete-btn";
    remove.textContent = "×";
    remove.title = "Delete task";
    remove.onclick = () => deleteTask(task.id);

    actions.appendChild(edit);
    actions.appendChild(remove);

    li.appendChild(check);
    li.appendChild(content);
    li.appendChild(actions);

    return li;
}

/* =========================================================
   RENDER
========================================================= */
function renderTasks(){
    taskList.innerHTML = "";
    const filtered = getFilteredTasks();

    if(filtered.length === 0){
        taskList.innerHTML = `
            <div class="empty">
                <div class="empty-icon">📝</div>
                <h4>Nothing here yet!</h4>
                <p>${searchTerm ? "Try another search." : "Add your first task and get things done."}</p>
            </div>`;
    } else {
        filtered.forEach(task => taskList.appendChild(createTaskCard(task)));
    }

    updateStats();
}

function updateStats(){
    const total = tasks.length;
    const completed = tasks.filter(t => t.completed).length;
    const remaining = total - completed;
    const important = tasks.filter(t => t.priority === "important").length;
    const urgent = tasks.filter(t => t.priority === "urgent").length;

    totalStat.textContent = total;
    doneStat.textContent = completed;
    remainingStat.textContent = remaining;

    allCount.textContent = total;
    importantCount.textContent = important;
    urgentCount.textContent = urgent;
    completedCount.textContent = completed;

    const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;
    progressFill.style.width = percentage + "%";
    progressText.textContent = percentage + "%";

    const shown = getFilteredTasks().length;
    taskCount.textContent = shown === 1 ? "1 task" : shown + " tasks";

    pageTitle.textContent =
        currentFilter === "all" ? "Your checklist" :
        currentFilter === "important" ? "⭐ Important tasks" :
        currentFilter === "urgent" ? "⚡ Urgent tasks" : "✓ Completed tasks";
}

/* =========================================================
   FILTERS / SEARCH / ADD
========================================================= */
document.querySelectorAll(".filter-item").forEach(item => {
    item.addEventListener("click", function(){
        document.querySelectorAll(".filter-item").forEach(m => m.classList.remove("active"));
        this.classList.add("active");
        currentFilter = this.dataset.filter;
        renderTasks();
    });
});

searchInput.addEventListener("input", function(){
    searchTerm = this.value.toLowerCase().trim();
    renderTasks();
});

addBtn.addEventListener("click", addTask);
taskInput.addEventListener("keydown", e => { if(e.key === "Enter") addTask(); });

/* =========================================================
   INITIAL LOAD
========================================================= */
renderTasks();
</script>
</body>
</html>
