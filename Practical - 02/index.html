<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Report | Academic Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Ambient Animated Background Lights -->
    <div class="ambient-light blob-1"></div>
    <div class="ambient-light blob-2"></div>
    <div class="ambient-light blob-3"></div>

    <div class="app-wrapper">
        <div class="container">
            
            <!-- Header Section -->
            <header class="app-header">
                <div class="badge-tag">
                    <span class="pulse-dot"></span> Academic Portal !!!
                </div>
                <h1>Student Grade Report</h1>
                <p class="subtitle">Smart Academic Performance Evaluation System</p>
            </header>

            <div class="form">
                
                <!-- Section 1: Student Information -->
                <div class="section-card">
                    <div class="section-header">
                        <i class="fa-solid fa-user-graduate icon-gradient"></i>
                        <span>Student Profile Details</span>
                    </div>

                    <div class="row">
                        <div class="input-box">
                            <label for="name">
                                <i class="fa-solid fa-user"></i> Student Name
                            </label>
                            <div class="input-wrapper">
                                <input type="text" id="name" placeholder="e.g. Vedant Nawghare" autocomplete="off">
                                <span class="focus-border"></span>
                            </div>
                        </div>

                        <div class="input-box">
                            <label for="prn">
                                <i class="fa-solid fa-id-card"></i> PRN Number
                            </label>
                            <div class="input-wrapper">
                                <input type="text" id="prn" placeholder="e.g. 24070521XXX" autocomplete="off">
                                <span class="focus-border"></span>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="input-box">
                            <label for="class">
                                <i class="fa-solid fa-graduation-cap"></i> Class / Year
                            </label>
                            <div class="input-wrapper">
                                <input type="text" id="class" placeholder="e.g. 1,2,3,4" autocomplete="off">
                                <span class="focus-border"></span>
                            </div>
                        </div>

                        <div class="input-box">
                            <label for="section">
                                <i class="fa-solid fa-layer-group"></i> Section
                            </label>
                            <div class="input-wrapper">
                                <input type="text" id="section" placeholder="e.g. Division A" autocomplete="off">
                                <span class="focus-border"></span>
                            </div>
                        </div>
                    </div>

                    <div class="input-box">
                        <label for="dob">
                            <i class="fa-solid fa-calendar-days"></i> Date of Birth
                        </label>
                        <div class="input-wrapper">
                            <input type="date" id="dob">
                            <span class="focus-border"></span>
                        </div>
                    </div>
                </div>

                <!-- Section 2: Subject Marks -->
                <div class="section-card">
                    <div class="section-header">
                        <i class="fa-solid fa-chart-simple icon-gradient"></i>
                        <span>Subject Marks (Out of 100)</span>
                    </div>

                    <div class="subjects">

                        <div class="input-box">
                            <label for="m1">
                                <i class="fa-solid fa-calculator subject-icon math"></i> Mathematics-I
                            </label>
                            <div class="input-wrapper">
                                <input type="number" id="m1" min="0" max="100" placeholder="0 - 100">
                                <span class="focus-border"></span>
                            </div>
                        </div>

                        <div class="input-box">
                            <label for="dbms">
                                <i class="fa-solid fa-database subject-icon db"></i> DBMS
                            </label>
                            <div class="input-wrapper">
                                <input type="number" id="dbms" min="0" max="100" placeholder="0 - 100">
                                <span class="focus-border"></span>
                            </div>
                        </div>

                        <div class="input-box">
                            <label for="js">
                                <i class="fa-brands fa-js subject-icon js"></i> JavaScript
                            </label>
                            <div class="input-wrapper">
                                <input type="number" id="js" min="0" max="100" placeholder="0 - 100">
                                <span class="focus-border"></span>
                            </div>
                        </div>

                        <div class="input-box">
                            <label for="toc">
                                <i class="fa-solid fa-gears subject-icon toc"></i> TOC
                            </label>
                            <div class="input-wrapper">
                                <input type="number" id="toc" min="0" max="100" placeholder="0 - 100">
                                <span class="focus-border"></span>
                            </div>
                        </div>

                        <div class="input-box full-width-mobile">
                            <label for="python">
                                <i class="fa-brands fa-python subject-icon py"></i> Python
                            </label>
                            <div class="input-wrapper">
                                <input type="number" id="python" min="0" max="100" placeholder="0 - 100">
                                <span class="focus-border"></span>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Submit Button -->
                <button class="btn-calculate" onclick="calculateGrade()">
                    <span class="btn-content">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Report Card
                    </span>
                    <span class="btn-glow"></span>
                </button>

                <!-- Result Container -->
                <div id="result"></div>

            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
